<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#100c1f" />
    <title>You're offline | Why?</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; text-align: center;
        background: radial-gradient(600px 400px at 20% 0%, rgba(124,58,237,.45), transparent 60%),
          radial-gradient(600px 400px at 100% 100%, rgba(249,115,22,.3), transparent 60%), #100c1f;
      }
      img { width: 96px; height: 96px; border-radius: 24px; }
      h1 { margin: 20px 0 8px; font-size: 28px; }
      p { margin: 0 auto; max-width: 320px; color: rgba(255,255,255,.8); line-height: 1.5; }
      button { margin-top: 24px; border: 0; border-radius: 999px; padding: 14px 28px; font-size: 16px; font-weight: 800;
        color: #fff; background: linear-gradient(90deg, #7c3aed, #db2777); }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="Why?" />
      <h1>You're offline</h1>
      <p>Why? needs the internet to find new facts. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
