apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "com.ogstreamz196.why"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ogstreamz196.why"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play needs a higher versionCode for every upload. When building in
        // Android Studio, raise the "1" below (and the version name) before
        // each release; CI overrides both with environment variables.
        versionCode((System.getenv("WHY_VERSION_CODE") ?: "1").toInteger())
        versionName(System.getenv("WHY_VERSION_NAME") ?: "1.0.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Upload-key signing for Play. The keystore and passwords come from CI
    // secrets (see mobile/README.md); without them the release build is unsigned.
    def keystorePath = System.getenv("WHY_KEYSTORE_PATH")
    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("WHY_KEYSTORE_PASSWORD")
                keyAlias System.getenv("WHY_KEY_ALIAS")
                keyPassword System.getenv("WHY_KEY_PASSWORD")
            }
        }
    }
    buildFeatures {
        buildConfig = true
    }
    // RevenueCat public SDK keys (see WhyApplication.kt). Debug builds use the
    // RevenueCat Test Store, so purchases are simulated and free. Release builds
    // need the Google Play key (starts "goog_"), passed as REVENUECAT_ANDROID_KEY
    // (environment variable) or revenuecatAndroidKey (gradle.properties). Without
    // it a release build simply hides Why? Plus.
    def revenueCatTestKey = "test_TwmOFXskCaKQSjPSNqPdUNazNDe"
    def revenueCatReleaseKey = System.getenv("REVENUECAT_ANDROID_KEY") ?: (project.findProperty("revenuecatAndroidKey") ?: "")
    buildTypes {
        debug {
            buildConfigField "String", "REVENUECAT_API_KEY", "\"${revenueCatTestKey}\""
        }
        release {
            buildConfigField "String", "REVENUECAT_API_KEY", "\"${revenueCatReleaseKey}\""
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // RevenueCat Android SDK. Keep in step with the version the Capacitor
    // plugin brings in (purchases-hybrid-common 19.10.0 -> purchases 10.26.0).
    implementation "com.revenuecat.purchases:purchases:10.26.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
