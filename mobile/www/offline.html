<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Why? — offline</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 24px;
        background: radial-gradient(circle at 30% 20%, #3b0764 0%, #0b0518 60%);
        color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .q { font-size: 72px; line-height: 1; margin-bottom: 12px; }
      h1 { font-size: 24px; margin: 0 0 8px; }
      p { margin: 0 auto 24px; max-width: 300px; color: rgba(255,255,255,0.75); line-height: 1.5; }
      button {
        border: 0; border-radius: 999px; padding: 14px 28px; font-size: 16px; font-weight: 800;
        color: #fff; background: linear-gradient(90deg, #ff4d8d, #a855f7);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="q" aria-hidden="true">🤔</div>
      <h1>You're offline</h1>
      <p>Why? needs the internet to fetch new facts. Check your connection and try again.</p>
      <button type="button" onclick="window.location.href = 'https://package-your-dreams.lovable.app/'">Try again</button>
    </main>
  </body>
</html>
