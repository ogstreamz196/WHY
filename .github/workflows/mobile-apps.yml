# Builds the Android and iOS apps in mobile/.
#
# Android: every run produces
#   - why-android-test-apk: an APK you can install on a phone to try the app
#   - why-android-play-bundle: the .aab to upload to Google Play (signed with
#     your upload key when the ANDROID_* secrets are set; see mobile/README.md)
# iOS: compiles the project for the simulator to prove it builds. Uploading to
# the App Store needs your Apple Developer account (see mobile/README.md).
name: Mobile apps

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown in the stores, e.g. 1.0.0"
        required: false
        default: "1.0.0"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apps.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apps.yml"

permissions:
  contents: read

jobs:
  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      # Play needs a higher version code for every upload.
      WHY_VERSION_CODE: ${{ github.run_number }}
      WHY_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm ci

      - name: Sync native project
        run: npx cap sync android

      - name: Set up upload key
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
            echo "Upload key found: the Play bundle will be signed."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set: the Play bundle will be unsigned and can't be uploaded yet."
          fi

      - name: Build test APK and Play bundle
        working-directory: mobile/android
        env:
          WHY_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          WHY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WHY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WHY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: why-android-test-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: why-android-play-bundle
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios:
    name: iOS build check
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Capacitor
        run: npm ci

      - name: Sync native project
        run: npx cap sync ios

      - name: Build for the iOS simulator (no signing)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
